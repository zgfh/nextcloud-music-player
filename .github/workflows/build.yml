name: Build and Release

# Flet 打包（flet build）：与本地 deploy_iso.sh 同一套工具链
# （Flutter 3.44.8 + flet 0.86.5），按平台矩阵出包。
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.8'
  FLET_VERSION: '0.86.5'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run unit tests
      run: python -m pytest tests/ -v

  build-android:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: stable
        cache: true

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e . "flet==${FLET_VERSION}" "flet-audio==${FLET_VERSION}" "flet-cli==${FLET_VERSION}"

    - name: Build Android APK
      run: flet build apk --yes

    - name: Upload Android artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-build
        path: build/flutter/build/app/outputs/flutter-apk/*.apk
        if-no-files-found: error
        retention-days: 7

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        # gstreamer 为 flet-audio 的 Linux 后端依赖
        sudo apt-get install -y cmake ninja-build clang libgtk-3-dev \
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: stable
        cache: true

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e . "flet==${FLET_VERSION}" "flet-audio==${FLET_VERSION}" "flet-cli==${FLET_VERSION}"

    - name: Build Linux app
      run: flet build linux --yes

    - name: Package Linux app
      run: |
        tar -czf nextcloud-music-player-linux-x64.tar.gz \
          -C build/flutter/build/linux/x64/release bundle

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-build
        path: nextcloud-music-player-linux-x64.tar.gz
        if-no-files-found: error
        retention-days: 7

  build-windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    # flet CLI 的 rich 输出含 emoji，Windows 控制台默认 cp1252 编码会崩溃
    env:
      PYTHONUTF8: '1'
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: stable
        cache: true

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e . "flet==${Env:FLET_VERSION}" "flet-audio==${Env:FLET_VERSION}" "flet-cli==${Env:FLET_VERSION}"
      shell: pwsh

    - name: Build Windows app
      run: flet build windows --yes

    - name: Package Windows app
      run: |
        Compress-Archive -Path "build/flutter/build/windows/x64/runner/Release/*" -DestinationPath "nextcloud-music-player-windows-x64.zip"
      shell: pwsh

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: nextcloud-music-player-windows-x64.zip
        if-no-files-found: error
        retention-days: 7

  build-macos:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: stable
        cache: true

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e . "flet==${FLET_VERSION}" "flet-audio==${FLET_VERSION}" "flet-cli==${FLET_VERSION}"

    # CI 无开发者证书，走 ad-hoc 签名（可本地运行，分发需重签）
    - name: Build macOS app
      run: flet build macos --yes

    - name: Package macOS app
      run: |
        APP=$(find build/flutter/build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -1)
        ditto -c -k --keepParent "$APP" nextcloud-music-player-macos.zip

    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-build
        path: nextcloud-music-player-macos.zip
        if-no-files-found: error
        retention-days: 7

  # CI 无 Apple 开发者证书/描述文件，正式签名的 IPA 由本地 deploy_iso.sh 完成；
  # 这里出模拟器 .app 验证 iOS 端可编译打包。
  build-ios:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: stable
        cache: true

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e . "flet==${FLET_VERSION}" "flet-audio==${FLET_VERSION}" "flet-cli==${FLET_VERSION}"

    - name: Build iOS Simulator app
      run: flet build ios-simulator --yes

    - name: Package iOS Simulator app
      run: |
        APP=$(find build/flutter/build/ios/iphonesimulator -name "*.app" -maxdepth 1 | head -1)
        ditto -c -k --keepParent "$APP" nextcloud-music-player-ios-simulator.zip

    - name: Upload iOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ios-build
        path: nextcloud-music-player-ios-simulator.zip
        if-no-files-found: error
        retention-days: 7

  # 发布开发版本（仅 main 分支 push，避免 PR 触发刷 release）
  publish-dev:
    if: github.event_name == 'push' && (needs.build-android.result == 'success' || needs.build-linux.result == 'success' || needs.build-windows.result == 'success' || needs.build-macos.result == 'success' || needs.build-ios.result == 'success')
    needs: [build-android, build-linux, build-windows, build-macos, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create development release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: dev-${{ github.sha }}
        name: Development Build ${{ github.sha }}
        body: |
          Development build from commit ${{ github.sha }}

          This is an automated development release. Use at your own risk.

          **📦 Available Downloads:**
          - **Desktop**: Linux (tar.gz), Windows (zip), macOS (zip, ad-hoc signed)
          - **Mobile**: Android APK, iOS Simulator app (zip)

          **📱 iOS 设备安装：** 正式签名 IPA 请使用本地 `scripts/deploy_iso.sh` 构建（需要 Apple 开发者证书）。

          **Changes:**
          ${{ github.event.head_commit.message }}
        files: |
          artifacts/android-build/*.apk
          artifacts/linux-build/*.tar.gz
          artifacts/windows-build/*.zip
          artifacts/macos-build/*.zip
          artifacts/ios-build/*.zip
        prerelease: true
        token: ${{ secrets.GITHUB_TOKEN }}

  # 发布正式版本（GitHub Release 发布时）
  publish-release:
    if: github.event_name == 'release'
    needs: [build-android, build-linux, build-windows, build-macos, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Upload release assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/android-build/*.apk
          artifacts/linux-build/*.tar.gz
          artifacts/windows-build/*.zip
          artifacts/macos-build/*.zip
          artifacts/ios-build/*.zip
        token: ${{ secrets.GITHUB_TOKEN }}
