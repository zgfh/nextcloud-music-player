name: E2E Tests

# Flet 集成测试（flet test）：在真实 Flutter 渲染进程中驱动打包形态的 app。
# 首次 provision 较慢（下载 embedded Python + 克隆 flet 仓库 + 编译测试宿主），
# 因此只在 PR / main push / 手动触发时运行，不随 feature 分支每次 push 跑。
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest tests/ -v

  flet-e2e:
    needs: unit
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 与本地开发保持同一 Flutter 版本，避免渲染/构建差异
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "flet[test]==0.86.5"

      - name: Run Flet E2E tests (macOS)
        run: flet test --tests-dir tests/e2e -v

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flet-test-build
          path: build/
          if-no-files-found: ignore
