[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-music-player"
version = "0.1.0"
description = "A cross-platform music player for Nextcloud, SMB, and Google Drive"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
keywords = ["music", "player", "nextcloud", "flet", "flutter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "flet>=0.86.0",
    "flet-audio>=0.86.0",
    "requests>=2.25.0",
    "httpx>=0.24.0",
    # SMB 音乐来源：必须保持纯 Python（仅依赖 pyasn1），
    # 以便 flet build ios/android 的 serious-python 能打包进应用。
    "pysmb",
    # 注意：flet build ios 在 macOS (darwin) 上执行打包，
    # `sys_platform == 'ios'` 标记在打包机上永远为假，包不会进入 iOS bundle，
    # 故不能使用该标记（曾导致 iOS 上无声回退到 FallbackAudioPlayer）。
    "rubicon-objc; sys_platform == 'darwin' or sys_platform == 'ios'",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "black",
    "flake8",
    "isort",
    "mypy",
    # run_web.py（Web 模式 / 公网隧道测试）所需
    "uvicorn",
    "fastapi",
    # e2e（flet test）所需：flet.testing 依赖 numpy/pillow/scikit-image
    # （golden 截图 SSIM 对比），pytest 插件与 pytest-asyncio 已在上文
    "flet[test]>=0.86.0",
]
desktop = [
    "pygame>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
# e2e 集成测试（tests/e2e）需要 flet test 预置 Flutter 测试宿主，
# 不参与日常 pytest；显式运行：flet test --tests-dir tests/e2e
norecursedirs = [".*", "build", "dist", "CVS", "_darcs", "{arch}", "*.egg", "e2e"]
# 交互测试大量使用 asyncio.sleep 模拟慢网络，统一用事件循环时间
filterwarnings = [
    "ignore::DeprecationWarning",
]

# 明确指定包的位置
[tool.setuptools.packages.find]
where = ["src"]

# 与 black 输出保持一致，避免 isort --check 与 black --check 互相冲突
[tool.isort]
profile = "black"

[tool.setuptools.package-data]
"nextcloud_music_player.resources" = ["*"]

[project.urls]
Homepage = "https://github.com/zgfh/cloud-music-player"
"Bug Tracker" = "https://github.com/zgfh/cloud-music-player/issues"
"Source Code" = "https://github.com/zgfh/cloud-music-player"

[project.scripts]
cloud-music-player = "nextcloud_music_player.__main__:main"

# === Flet 配置 ===
[tool.flet]
artifact = "Cloud Music Player"
product = "Cloud Music Player"
org = "com.daozzg"
bundle_id = "com.daozzg.nextcloud-music-player"

[tool.flet.app]
path = "src"

[tool.flet.ios]
team_id = "6CS69Y977H"

[tool.flet.ios.info]
UIBackgroundModes = ["audio"]

# ATS 例外必须是 plist 字典（TOML 嵌套表）——写成字符串时 flet 会原样
# 写入 Info.plist，iOS 解析不到合法字典即按默认策略拦截所有明文 HTTP
# （NSURLErrorDomain -1022），家庭服务器 http:// 地址全部下载失败。
[tool.flet.ios.info.NSAppTransportSecurity]
NSAllowsArbitraryLoads = true
NSAllowsLocalNetworking = true

[tool.flet.android]
permissions = ["INTERNET", "WAKE_LOCK", "FOREGROUND_SERVICE"]
