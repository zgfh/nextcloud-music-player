[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nextcloud-music-player"
version = "0.1.0"
description = "A cross-platform music player with NextCloud integration"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
keywords = ["music", "player", "nextcloud", "flet", "flutter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "flet>=0.86.0",
    "requests>=2.25.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "flake8",
    "isort",
    "mypy",
]
desktop = [
    "pygame>=2.0.0",
]

# 明确指定包的位置
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nextcloud_music_player.resources" = ["*"]

[project.urls]
Homepage = "https://example.com/nextcloud-music-player"
"Bug Tracker" = "https://github.com/example/nextcloud-music-player/issues"
"Source Code" = "https://github.com/example/nextcloud-music-player"

[project.scripts]
nextcloud-music-player = "nextcloud_music_player.__main__:main"

# === Flet 配置 ===
[tool.flet]
app_name = "nextcloud-music-player"
app_description = "A cross-platform music player with NextCloud integration"
org_name = "com.daozzg"
product_name = "NextCloud Music Player"

[tool.flet.app]
path = "src"

[tool.flet.ios]
team_id = "6CS69Y977H"
bundle_id = "com.daozzg.nextcloud-music-player"

[tool.flet.ios.info]
UIBackgroundModes = ["audio"]
NSAppTransportSecurity = "{NSAllowsArbitraryLoads = true, NSAllowsLocalNetworking = true}"

[tool.flet.android]
permissions = ["INTERNET", "WAKE_LOCK", "FOREGROUND_SERVICE"]
